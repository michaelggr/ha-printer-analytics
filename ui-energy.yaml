      # ---------- 入库说明 ----------
      - type: markdown
        content: |
          **统计口径**
          - 今日：12 个区域 `history_stats` 的今日累计值，每 5 分钟快照写入 MariaDB `area_stay_daily`（`entity_id + period_date` 唯一键覆盖更新，跨零点自动结算，历史永久保留）
          - 近 7 日：`area_stay_daily` 近 7 天（含今日）合计；本月：本月 1 日至今合计
          - 合计会大于 24h：12 个区域分别计时，人在多区域停留会被分别计入，属正常
          - 北阳台由 PIR「有人移动」事件派生，10 分钟无新移动回落无人，统计略偏保守
          - 厨房 / 公卫干区 / 走廊 由雷达灯「有人持续时长 > 0」派生
          - 主卫 / 公卫 使用人体感应器原生「有人」状态
