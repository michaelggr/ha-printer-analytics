---
# 能源账单看板 (电费 + 燃气费)
# 数据源: state_grid (国网) + crcgas (华润燃气) + utility_tracker (MariaDB 统计)
title: 能源账单
views:
  # ============================================================
  # View 1: 概览
  # ============================================================
  - title: 概览
    icon: mdi:view-dashboard
    path: overview
    cards:
      # ---------- 顶部问候 ----------
      - type: custom:mushroom-template-card
        primary: 能源账单
        secondary: >-
          {# 本月电费 = 本月实时用电量 × 上月结算单价（当月账单未出时也能反映最新用电） #}
          {% set m_u = states('sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_current_month_usage') | float(0) %}
          {% set m_lu = states('sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_previous_settled_month_usage') | float(0) %}
          {% set m_lc = states('sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_previous_settled_month_charge') | float(0) %}
          {% set m_p = (m_lc / m_lu) if m_lu > 0 else 0.558 %}
          {% set r_u = states('sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_current_month_usage') | float(0) %}
          {% set r_lu = states('sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_previous_settled_month_usage') | float(0) %}
          {% set r_lc = states('sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_previous_settled_month_charge') | float(0) %}
          {% set r_p = (r_lc / r_lu) if r_lu > 0 else 0.608 %}
          {% set gas_m = states('sensor.utility_tracker_gas_this_month_main') | float(0) %}
          {% set gas_r = states('sensor.utility_tracker_gas_this_month_rental') | float(0) %}
          自住 · 电费 ≈¥{{ '%.2f' | format(m_u * m_p) }} / 燃气费 ¥{{ '%.2f' | format(gas_m) }}
          出租 · 电费 ≈¥{{ '%.2f' | format(r_u * r_p) }} / 燃气费 ¥{{ '%.2f' | format(gas_r) }}
        icon: mdi:cash-multiple
        icon_color: green
        multiline_secondary: true

      # ---------- 关键指标 chips ----------
      - type: custom:mushroom-chips-card
        chips:
          - type: template
            icon: mdi:flash
            content: >-
              自¥{{ states('sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_account_balance') }}
            tap_action:
              action: more-info
              entity: sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_account_balance
          - type: template
            icon: mdi:flash-outline
            content: >-
              租¥{{ states('sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_account_balance') }}
            tap_action:
              action: more-info
              entity: sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_account_balance
          - type: template
            icon: mdi:fire
            content: >-
              自¥{{ states('sensor.hua_run_ran_qi_ran_qi_zhang_hu_yu_e') }}
            tap_action:
              action: more-info
              entity: sensor.hua_run_ran_qi_ran_qi_zhang_hu_yu_e
          - type: template
            icon: mdi:fire-circle
            content: >-
              租¥{{ states('sensor.hua_run_ran_qi_1021540961_ran_qi_zhang_hu_yu_e_fu_xin') }}
            tap_action:
              action: more-info
              entity: sensor.hua_run_ran_qi_1021540961_ran_qi_zhang_hu_yu_e_fu_xin
          - type: template
            icon: mdi:database
            content: >-
              {{ states('sensor.utility_tracker_total_records') }} 条
            tap_action:
              action: more-info
              entity: sensor.utility_tracker_total_records
          - type: template
            icon: mdi:sync
            content: >-
              {{ states('sensor.utility_tracker_db_status') }}
            tap_action:
              action: more-info
              entity: sensor.utility_tracker_db_status

      # ---------- 本月汇总 (自住 vs 出租) ----------
      - type: custom:mushroom-title-card
        title: 自住 · 新天地
        icon: mdi:home
        alignment: left
        subtitle: 本月电费/燃气账单
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_current_month_usage
            name: 本月用电
            icon: mdi:lightning-bolt
            icon_color: orange
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_ben_qi_yong_qi_liang
            name: 本月用气
            icon: mdi:fire
            icon_color: red
          # 本月电费（估算）= 本月实时用电量 × 上月结算单价，当月账单未出时也能反映最新数据
          - type: custom:mushroom-template-card
            primary: >-
              {% set u = states('sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_current_month_usage') | float(0) %}
              {% set lu = states('sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_previous_settled_month_usage') | float(0) %}
              {% set lc = states('sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_previous_settled_month_charge') | float(0) %}
              {% set p = (lc / lu) if lu > 0 else 0.558 %}
              ¥{{ '%.2f' | format(u * p) }}
            secondary: >-
              {% set u = states('sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_current_month_usage') | float(0) %}
              {% set lu = states('sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_previous_settled_month_usage') | float(0) %}
              {% set lc = states('sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_previous_settled_month_charge') | float(0) %}
              {% set p = (lc / lu) if lu > 0 else 0.558 %}
              本月 {{ u }} 度 × ¥{{ '%.3f' | format(p) }}/度
            icon: mdi:cash
            icon_color: amber
            entity: sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_current_month_usage
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_zhang_dan_jin_e
            name: 本期燃气账单
            icon: mdi:receipt
            icon_color: blue

      - type: custom:mushroom-title-card
        title: 出租 · 佳园
        icon: mdi:key-variant
        alignment: left
        subtitle: 本月电费/燃气账单
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_current_month_usage
            name: 本月用电
            icon: mdi:lightning-bolt
            icon_color: amber
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_1021540961_ben_qi_yong_qi_liang_fu_xin
            name: 本月用气
            icon: mdi:fire
            icon_color: red
          # 本月电费（估算）= 本月实时用电量 × 上月结算单价
          - type: custom:mushroom-template-card
            primary: >-
              {% set u = states('sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_current_month_usage') | float(0) %}
              {% set lu = states('sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_previous_settled_month_usage') | float(0) %}
              {% set lc = states('sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_previous_settled_month_charge') | float(0) %}
              {% set p = (lc / lu) if lu > 0 else 0.608 %}
              ¥{{ '%.2f' | format(u * p) }}
            secondary: >-
              {% set u = states('sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_current_month_usage') | float(0) %}
              {% set lu = states('sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_previous_settled_month_usage') | float(0) %}
              {% set lc = states('sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_previous_settled_month_charge') | float(0) %}
              {% set p = (lc / lu) if lu > 0 else 0.608 %}
              本月 {{ u }} 度 × ¥{{ '%.3f' | format(p) }}/度
            icon: mdi:cash
            icon_color: amber
            entity: sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_current_month_usage
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_1021540961_zhang_dan_jin_e_fu_xin
            name: 本期燃气账单
            icon: mdi:receipt
            icon_color: blue

      # ---------- 电信话费 (199****7382) ----------
      - type: custom:mushroom-title-card
        title: 电信话费
        icon: mdi:phone
        alignment: left
        subtitle: 199****7382 套餐 · 余额 / 流量 / 通话
      - type: custom:ctm-telecom-card
        device_id: 88311b83e60b69a0329ea5b95b34bb71
        title: 电信 199****7382
        balance_warning_below: 10
        usage_warning_percent: 80
        usage_danger_percent: 95
      # 关键指标 chips
      - type: custom:mushroom-chips-card
        chips:
          - type: template
            icon: mdi:cash
            content: >-
              ¥{{ states('sensor.199_7382_tao_can_xin_xi_199_7382_dian_xin_zhang_hu_yu_e') }}
            tap_action:
              action: more-info
              entity: sensor.199_7382_tao_can_xin_xi_199_7382_dian_xin_zhang_hu_yu_e
          - type: template
            icon: mdi:network
            content: >-
              流量 {{ states('sensor.199_7382_tao_can_xin_xi_199_7382_liu_liang_shi_yong_lu') }}%
            tap_action:
              action: more-info
              entity: sensor.199_7382_tao_can_xin_xi_199_7382_liu_liang_shi_yong_lu
          - type: template
            icon: mdi:phone
            content: >-
              通话余 {{ states('sensor.199_7382_tao_can_xin_xi_199_7382_tong_hua_sheng_yu') }}分钟
            tap_action:
              action: more-info
              entity: sensor.199_7382_tao_can_xin_xi_199_7382_tong_hua_sheng_yu
          - type: template
            icon: mdi:refresh
            content: >-
              {{ states('sensor.199_7382_tao_can_xin_xi_199_7382_shu_ju_geng_xin_shi_jian') | as_datetime | relative_time }}
            tap_action:
              action: more-info
              entity: sensor.199_7382_tao_can_xin_xi_199_7382_shu_ju_geng_xin_shi_jian

      # ---------- 近30天用电趋势 ----------
      - type: custom:apexcharts-card
        header:
          show: true
          title: 近30天每日用电 (含峰谷)
          show_states: true
          colorize_states: true
        graph_span: 30d
        span:
          end: day
        series:
          - entity: sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_previous_daily_usage
            name: 佳园
            type: column
            color: '#FFB74D'
          - entity: sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_previous_daily_usage
            name: 新天地
            type: column
            color: '#64B5F6'

      # ---------- 本年累计 ----------
      - type: custom:mushroom-title-card
        title: 本年累计电费
        subtitle: 两户年度电量与费用
        icon: mdi:counter
        alignment: left
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_current_year_usage
            name: 本年电量 (佳园)
            icon: mdi:counter
            icon_color: green
          - type: custom:mushroom-entity-card
            entity: sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_current_year_charge
            name: 本年电费 (佳园)
            icon: mdi:cash
            icon_color: green
          - type: custom:mushroom-entity-card
            entity: sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_current_year_usage
            name: 本年电量 (新天地)
            icon: mdi:counter
            icon_color: teal
          - type: custom:mushroom-entity-card
            entity: sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_current_year_charge
            name: 本年电费 (新天地)
            icon: mdi:cash
            icon_color: teal

      # ---------- 燃气阶梯 ----------
      - type: custom:mushroom-title-card
        title: 燃气阶梯
        icon: mdi:stairs
        alignment: left
        subtitle: 三阶梯用量与价格
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_ben_qi_yi_jie_ti_yong_qi_liang
            name: 一阶梯用量
            icon: mdi:stairs
            icon_color: green
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_ben_qi_er_jie_ti_yong_qi_liang
            name: 二阶梯用量
            icon: mdi:stairs
            icon_color: amber
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_ben_qi_san_jie_ti_yong_qi_liang
            name: 三阶梯用量
            icon: mdi:stairs
            icon_color: red
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_yi_jie_ti_qi_jie
            name: 一阶梯价
            icon: mdi:currency-cny
            icon_color: green
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_er_jie_ti_qi_jie
            name: 二阶梯价
            icon: mdi:currency-cny
            icon_color: amber
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_san_jie_ti_qi_jie
            name: 三阶梯价
            icon: mdi:currency-cny
            icon_color: red

  # ============================================================
  # View 2: 电费详情
  # ============================================================
  - title: 电费
    icon: mdi:flash
    path: electricity
    cards:
      - type: custom:mushroom-title-card
        title: 电费账户
        icon: mdi:wallet
        alignment: left
        subtitle: 两个户号的余额与本月用电
      - type: grid
        columns: 2
        square: false
        cards:
          # 佳园
          - type: custom:mushroom-entity-card
            entity: sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_account_balance
            name: 佳园 余额
            icon: mdi:wallet
            icon_color: green
          - type: custom:mushroom-entity-card
            entity: sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_current_month_usage
            name: 佳园 本月用电
            icon: mdi:lightning-bolt
            icon_color: amber
          # 新天地
          - type: custom:mushroom-entity-card
            entity: sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_account_balance
            name: 新天地 余额
            icon: mdi:wallet
            icon_color: green
          - type: custom:mushroom-entity-card
            entity: sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_current_month_usage
            name: 新天地 本月用电
            icon: mdi:lightning-bolt
            icon_color: orange

      # 近30天日用量对比
      - type: custom:apexcharts-card
        header:
          show: true
          title: 近30天日用量对比
        graph_span: 30d
        span:
          end: day
        series:
          - entity: sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_previous_daily_usage
            name: 佳园
            type: line
            curve: smooth
            color: '#FFB74D'
          - entity: sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_previous_daily_usage
            name: 新天地
            type: line
            curve: smooth
            color: '#64B5F6'

      # 上月结算
      - type: custom:mushroom-title-card
        title: 上一结算月
        subtitle: 上月电量与费用
        icon: mdi:calendar-arrow-left
        alignment: left
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_previous_settled_month_usage
            name: 佳园 上月电量
            icon: mdi:counter
          - type: custom:mushroom-entity-card
            entity: sensor.99_6aefa11d6e8945fca3a9f9c28433cdb7_02_osg_uc_2610271638_002_7061_previous_settled_month_charge
            name: 佳园 上月电费
            icon: mdi:cash
          - type: custom:mushroom-entity-card
            entity: sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_previous_settled_month_usage
            name: 新天地 上月电量
            icon: mdi:counter
          - type: custom:mushroom-entity-card
            entity: sensor.99_681845e394434cdbb0e9c0538145c306_02_osg_uc_2610271638_002_0065_previous_settled_month_charge
            name: 新天地 上月电费
            icon: mdi:cash

  # ============================================================
  # View 3: 燃气费详情 (自住 + 出租 分户)
  # ============================================================
  - title: 燃气费
    icon: mdi:fire
    path: gas
    cards:
      # ========== 自住 · 东方新天地 ==========
      - type: custom:mushroom-title-card
        title: 自住 · 新天地
        icon: mdi:home
        alignment: left
        subtitle: 户号 1040395237
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_ran_qi_zhang_hu_yu_e
            name: 账户余额
            icon: mdi:wallet
            icon_color: green
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_qian_fei_jin_e
            name: 欠费金额
            icon: mdi:cash-clock
            icon_color: red
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_lei_ji_ran_qi_fei_yong
            name: 累计费用
            icon: mdi:cash-multiple
            icon_color: blue
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_wei_yue_jin
            name: 违约金
            icon: mdi:alert-circle
            icon_color: orange
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_zhang_dan_yue_fen
            name: 账单月份
            icon: mdi:calendar-month
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_zhang_dan_jin_e
            name: 账单金额
            icon: mdi:receipt
            icon_color: blue
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_ben_qi_yong_qi_liang
            name: 本期用气量
            icon: mdi:fire
            icon_color: red
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_ben_qi_biao_du_shu
            name: 本期表读数
            icon: mdi:gauge

      - type: custom:mushroom-title-card
        title: 自住 · 阶梯剩余
        subtitle: 一阶/二阶/三阶剩余用量
        icon: mdi:stairs-down
        alignment: left
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_yi_jie_ti_sheng_yu_qi_liang
            name: 一阶剩余
            icon: mdi:stairs
            icon_color: green
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_er_jie_ti_sheng_yu_qi_liang
            name: 二阶剩余
            icon: mdi:stairs
            icon_color: amber
          - type: custom:mushroom-entity-card
            entity: sensor.hua_run_ran_qi_san_jie_ti_sheng_yu_qi_liang
            name: 三阶剩余
            icon: mdi:stairs
            icon_color: red

      # ========== 出租 · 东方佳园 ==========
      - type: custom:mushroom-title-card
        title: 出租 · 佳园
        icon: mdi:key-variant
        alignment: left
        subtitle: 户号 1021540961
      - type: grid
        columns: 2
        square: false
