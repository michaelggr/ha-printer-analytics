          - 上方各区域「亮灯时长」来自 `history_stats`，每日 0 点自动归零
          - 每 5 分钟把今日累计时长快照写入 MariaDB `light_duration_daily`（按区域+日期唯一），长期保留
          - 开关次数仍由事件流表 `light_daily` 记录，两者互补
          - 总时长 = {{ states('sensor.utility_tracker_light_duration_today') }} h（数据库口径，与实体合计一致）

